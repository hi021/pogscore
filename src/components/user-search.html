<form class="search-input-wrapper input-dark row" (ngSubmit)="onSubmit()">
	<div class="autocmp-wrapper">
		<input
			class="search-input input-dark"
			type="text"
			name="query"
			placeholder="osu! username"
			autocomplete="off"
			spellcheck="false"
			[disabled]="disabled"
			[(ngModel)]="query"
			(input)="onInput()"
		/>
		<ul class="autocmp-items">
			@for (plr of autocompleteEntries; track plr.user_id) {
				<li>
					<a [routerLink]="['/player', plr.user_id]" class="autocmp-item" tabindex="0" role="button">
						<img class="avatar-medium" alt="" [src]="Utils.getAvatarURL(plr.user_id)" />
						<span>{{ plr.username }}</span>
						@if (plr.rank) {
							<span class="autocmp-rank">#{{ plr.rank }}</span>
						}
					</a>
				</li>
			}
		</ul>
	</div>

	<button type="submit" class="btn-search btn-none" aria-label="Search" [disabled]="disabled">
		<span class="icon search big"></span>
	</button>
</form>

<style>
	.search-input-wrapper {
		--radius: 0;
		position: relative;
		width: 100%;
		min-width: 4rem;
		max-width: 48rem;
		align-items: center;
		padding: 0;
		margin: 0 auto;
		border-radius: var(--radius);
		background-color: transparent;
		filter: drop-shadow(0 0 0 color-mix(transparent 100%, var(--color-pink)));
		transition: filter 0.125s ease;
	}
	.search-input-wrapper.disabled {
		opacity: 0.5;
		pointer-events: none;
	}
	.search-input-wrapper:focus-within {
		filter: drop-shadow(0.5rem 0.5rem 0 var(--color-pink));
	}

	/* TODO: hide on small screens */
	.btn-search {
		width: 3rem;
		padding: 10px;
		margin-left: -1px;
		align-self: stretch;
		border-radius: 0;
		color: inherit;
		background-color: var(--color-dark);
		clip-path: polygon(0 0.2rem, calc(100% - 0.333rem) 0.333rem, 100% calc(100% - 0.1rem), 0 calc(100% - 0.333rem));
	}
	.btn-search:not(:disabled):is(:hover, :focus) {
		background-color: var(--color-darker);
	}

	.search-input {
		padding-left: 1em;
		padding-right: 1em;
		background-color: var(--color-dark);
		width: 100%;
		clip-path: polygon(0 0, 100% 0.2rem, 100% calc(100% - 0.333rem), 0 100%);
	}
	.search-input:focus-visible {
		box-shadow: none;
		outline: transparent 3px solid;
	}

	.autocmp-wrapper {
		position: relative;
		display: inline-flex;
		width: auto;
		min-width: 0;
		flex: 1 1 0;
	}
	.autocmp-items {
		position: absolute;
		top: calc(100% - 0.25em);
		left: 0;
		right: -3em;
		margin: 0;
		padding: 0 24px;
		list-style: none;
		z-index: -1;
	}
	.autocmp-items > li:first-child > .autocmp-item {
		padding-top: 0.6825em;
	}

	.autocmp-item {
		display: flex;
		align-items: center;
		top: 100%;
		left: 0;
		right: 0;
		padding: 0.375em 0.5em;
		gap: 0.5em;
		cursor: pointer;
		color: inherit;
		background-color: var(--color-darkish);
		text-decoration: none;
		line-height: 1;
	}
	.autocmp-item:is(:hover, :focus-visible) {
		outline-color: transparent;
		background-color: var(--color-purple);
	}

	.autocmp-rank {
		margin-left: auto;
		opacity: 0.8;
		font-size: 75%;
	}
</style>
