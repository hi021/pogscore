@if (errorMsg()) {
	<p>{{ errorMsg() }}</p>
} @else if (player()) {
	<header class="row">
		<div class="avatar icon hexagon">
			<img class="icon" src="{{ Utils.getAvatarURL(player()!.user_id) }}" alt="" />
		</div>

		<div class="profile-info-wrapper">
			<div class="profile-info row flex-center-vertical">
				<span aria-label="osu! username" class="username">{{ player()!.username }}</span>
				<div class="vr"></div>
				<span class="rank" aria-label="current score rank" [ngClass]="getRankTier(player()!.rank)"
					>#{{ player()!.rank }}</span
				>
				<span class="peak-rank" aria-label="peak score rank" [ngxTippy]="'Peak rank achieved ' + peakRankDate"
					>#{{ player()!.rank_highest.rank }}</span
				>
				<span
					aria-label="ranked score"
					[ngxTippy]="Utils.formatNumber(player()!.score) + ' ranked score'"
					class="score"
					>{{ Utils.roundNumber(player()!.score) }}</span
				>
			</div>
			<div class="subheader flex-center">
				<a
					class="a no-decoration"
					target="_blank"
					href="{{ Utils.getOsuProfileURL(player()!.user_id) }}"
					aria-label="osu! profile"
					ngxTippy="osu! profile"
					rel="noreferrer"
				>
					<div class="icon-wrapper osu-icon-wrapper">
						<div></div>
						<span class="icon osu bigger"></span>
					</div>
				</a>
				<a
					class="a no-decoration"
					target="_blank"
					href="{{ Utils.getOsuStatsURL(player()!.username) }}"
					aria-label="osu!Stats"
					ngxTippy="osu!Stats"
					rel="noreferrer"
				>
					<div class="icon-wrapper chart-icon-wrapper">
						<div></div>
						<span class="icon chart-line"></span>
					</div>
				</a>
				<a
					class="a no-decoration"
					target="_blank"
					href="{{ Utils.getOsuTrackURL(player()!.username) }}"
					aria-label="osu!track"
					ngxTippy="osu!track"
					rel="noreferrer"
				>
					<div class="icon-wrapper">
						<div></div>
						<span class="icon chart-bar"></span>
					</div>
				</a>
				<a
					class="a no-decoration"
					target="_blank"
					href="{{ Utils.getOsuAltURL(player()!.user_id) }}"
					aria-label="osu! scores inspector"
					ngxTippy="osu! scores inspector"
					rel="noreferrer"
				>
					<div class="icon-wrapper">
						<div></div>
						<div style="font-weight: 300">alt</div>
					</div>
				</a>
				<a
					class="a no-decoration"
					target="_blank"
					href="{{ Utils.getOsuDailyURL(player()!.username) }}"
					aria-label="osu!daily"
					ngxTippy="osu!daily"
					rel="noreferrer"
				>
					<div class="icon-wrapper">
						<div></div>
						<div style="font-weight: 500">S</div>
					</div>
				</a>
			</div>
		</div>
	</header>

	<multi-line-chart
		[data]="rankData"
		yDirection="south"
		[xConfig]="xConfig"
		[yConfig]="yConfig"
		[tooltipTemplate]="tooltipTemplate"
	></multi-line-chart>
} @else {
	<p>loading...</p>
}
