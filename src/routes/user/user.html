@if (errorMsg()) {
	<p>{{ errorMsg() }}</p>
} @else if (player()) {
	<span> {{ player()!.user_id }} </span>
	<span> {{ player()!.username }} </span>

	<multi-line-chart
		[data]="rankData"
		yDirection="south"
		[xConfig]="xConfig"
		[yConfig]="yConfig"
		[tooltipTemplate]="tooltipTemplate"
	></multi-line-chart>
} @else {
	<p>loading...</p>
}
